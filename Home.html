<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
padding:30px;
}

/* topo */

.topo{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:40px;
}

.logo{
font-size:28px;
font-weight:bold;
background:linear-gradient(45deg,#3b82f6,#8b5cf6);
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
}

/* botão sair */

button{
padding:12px 20px;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#3b82f6,#8b5cf6);
color:white;
cursor:pointer;
font-size:15px;
}

/* cards */

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:rgba(255,255,255,0.05);
padding:25px;
border-radius:20px;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h2{
margin-bottom:15px;
}

.card p{
color:#cbd5e1;
}

</style>
</head>

<body onload="verificarLogin()">

<div class="topo">

<div class="logo">
STP-Digital
</div>

<button onclick="logout()">
Sair
</button>

</div>

<div class="container">

<div class="card">
<button onclick="window.location.href='ia.html'">
    <h2>🤖 IA Educativa</h2>
    <p>Aprenda tecnologia e inteligência artificial.</p>
    </div>
</button>

<div class="card">
    <Button onclick="window.location.href='Desafios.html'">
    <h2>🎮 Desafios</h2>
    <p>Complete missões e ganhe XP.</p>
    </Button>
    </div>


    
    <div class="card">
    <Button onclick="window.location.href='Comunidade.html'">
    <h2>🌍 Comunidade</h2>
    <p>Converse com jovens santomenses.</p>
    </Button>
    </div>
   


    <div class="card">
    <Button onclick="window.location.href='Ranking.html'">
            
            <h2>🔥 Ranking</h2>
            <p>Veja os melhores usuários da semana.</p>
     </Button>
            </div>
    


</div>

<script src="script.js"></script>

</body>
