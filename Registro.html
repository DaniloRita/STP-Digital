<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registrar - STP-Digital</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0f172a;
overflow:hidden;
}

/* fundo */
body::before{
content:"";
position:absolute;
width:400px;
height:400px;
background:#3b82f6;
border-radius:50%;
filter:blur(120px);
top:-100px;
left:-100px;
opacity:0.5;
}

body::after{
content:"";
position:absolute;
width:400px;
height:400px;
background:#8b5cf6;
border-radius:50%;
filter:blur(120px);
bottom:-100px;
right:-100px;
opacity:0.5;
}

.register-box{
position:relative;
width:350px;
padding:40px;
border-radius:20px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 0 30px rgba(0,0,0,0.3);
color:white;
z-index:10;
animation:fade 1s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.register-box h1{
text-align:center;
margin-bottom:30px;
font-size:30px;
}

.input-box{
margin-bottom:20px;
}

.input-box input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,0.08);
color:white;
font-size:16px;
}

.input-box input::placeholder{
color:#cbd5e1;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#3b82f6,#8b5cf6);
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
opacity:0.9;
}

.text{
text-align:center;
margin-top:20px;
color:#cbd5e1;
}

.text a{
color:#60a5fa;
text-decoration:none;
}

</style>
</head>

<body>

<div class="register-box">

<h1>Criar Conta</h1>

<div class="input-box">
<input type="text" placeholder="Nome de usuário">
</div>

<div class="input-box">
<input type="email" id="email" placeholder="Seu email">
</div>

<div class="input-box">
<input type="password" id="senha" placeholder="Criar senha">
</div>

<button onclick="registrar()">
Registrar
</button>

<div class="text">
Já tens conta?
<a href="Index.html">Entrar</a>
</div>

</div>
<script src="script.js"></script>
</body>
</html>
