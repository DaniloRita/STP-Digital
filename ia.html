<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IA STP-Digital</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

/* topo */

.topo{

padding:20px;

background:rgba(255,255,255,0.05);

backdrop-filter:blur(10px);

display:flex;

justify-content:space-between;

align-items:center;

}

.logo{

font-size:25px;

font-weight:bold;

background:linear-gradient(45deg,#3b82f6,#8b5cf6);

background-clip:text;

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

/* chat */

.chat{

flex:1;

padding:20px;

overflow-y:auto;

display:flex;

flex-direction:column;

gap:15px;

}

/* mensagens */

.msg-user{

align-self:flex-end;

background:linear-gradient(45deg,#3b82f6,#8b5cf6);

padding:15px;

border-radius:20px 20px 0 20px;

max-width:70%;

}

.msg-ia{

align-self:flex-start;

background:rgba(255,255,255,0.08);

padding:15px;

border-radius:20px 20px 20px 0;

max-width:70%;

}

/* área input */

.input-area{

display:flex;

padding:20px;

gap:10px;

background:rgba(255,255,255,0.03);

}

input{

flex:1;

padding:15px;

border:none;

outline:none;

border-radius:15px;

background:rgba(255,255,255,0.08);

color:white;

}

button{

padding:15px 25px;

border:none;

border-radius:15px;

background:linear-gradient(45deg,#3b82f6,#8b5cf6);

color:white;

cursor:pointer;

}

</style>
</head>

<body>

<div class="topo">

<div class="logo">
🤖 STP IA
</div>

</div>

<div class="chat" id="chat">

<div class="msg-ia">
Olá 😄 Eu sou a IA do STP-Digital.
</div>

</div>

<div class="input-area">

<input
type="text"
id="pergunta"
placeholder="Pergunte algo..."
>

<button onclick="enviar()">
Enviar
</button>

</div>

<script>
    const mensagens = [

{
role:"system",

content:`
Você é uma IA educativa do STP-Digital.

Sua missão é ajudar jovens santomenses com:
- educação
- programação
- tecnologia
- criatividade
- inteligência artificial
- pensamento positivo
- aprendizado saudável
- motivação
- cultura digital

Você deve:
- responder de forma clara
- ensinar com paciência
- incentivar respeito
- incentivar estudo e criatividade
- ajudar iniciantes

Nunca:
- incentive violência
- incentive ódio
- incentive crimes
- espalhe desinformação
- ensine coisas perigosas
- responda de forma ofensiva

Fale de forma moderna, amigável e inspiradora.
`
},

{
role:"user",
content: pergunta
}

];


function enviar(){

let pergunta =
document.getElementById("pergunta").value;

if(pergunta === ""){
return;
}

let chat =
document.getElementById("chat");

/* mensagem usuário */

chat.innerHTML += `
<div class="msg-user">
${pergunta}
</div>
`;

/* resposta IA */

let resposta =
"😄 Ainda estou aprendendo, mas no futuro serei uma IA poderosa do STP-Digital.";

/* mensagem ia */

chat.innerHTML += `
<div class="msg-ia">
${resposta}
</div>
`;

document.getElementById("pergunta").value = "";

/* descer automático */

chat.scrollTop = chat.scrollHeight;

}

</script>

</body>
</html>
