<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IA STP-Digital</title>
<link rel="shortcut icon" href="https://cdn.image2prompt.net/imgs/features/2.png" type="image/x-icon">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

/* topo */

.topo{

padding:20px;

background:rgba(255,255,255,0.05);

backdrop-filter:blur(10px);

display:flex;

justify-content:space-between;

align-items:center;

}

.logo{

font-size:25px;

font-weight:bold;

background:linear-gradient(45deg,#3b82f6,#8b5cf6);

background-clip:text;

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

/* chat */

.chat{

flex:1;

padding:20px;

overflow-y:auto;

display:flex;

flex-direction:column;

gap:15px;

}

/* mensagens */

.msg-user{

align-self:flex-end;

background:linear-gradient(45deg,#3b82f6,#8b5cf6);

padding:15px;

border-radius:20px 20px 0 20px;

max-width:70%;

}

.msg-ia{

align-self:flex-start;

background:rgba(45, 55, 73, 0.503);

padding:15px;

border-radius:20px 20px 20px 0;

max-width:100%;

}

/* área input */

.input-area{

display:flex;

padding:20px;

gap:10px;

background:rgba(255,255,255,0.03);

}

input{

flex:1;

padding:15px;

border:none;

outline:none;

border-radius:15px;

background:rgba(255,255,255,0.08);

color:white;

}

button{

padding:15px 25px;

border:none;

border-radius:15px;

background:linear-gradient(45deg,#3b82f6,#8b5cf6);

color:white;

cursor:pointer;

}
.typing{
display:flex;
gap:5px;
padding:15px;
background:rgba(255,255,255,0.08);
border-radius:20px;
width:70px;
}

.typing span{
width:10px;
height:10px;
background:white;
border-radius:50%;
animation:animar 1s infinite;
}

.typing span:nth-child(2){
animation-delay:0.2s;
}

.typing span:nth-child(3){
animation-delay:0.4s;
}

@keyframes animar{

0%{
opacity:0.3;
transform:translateY(0);
}

50%{
opacity:1;
transform:translateY(-5px);
}

100%{
opacity:0.3;
transform:translateY(0);
}

}


</style>
</head>

<body>

<div class="topo">

<div class="logo">
🤖 STP IA
</div>

</div>

<div class="chat" id="chat">

<div class="msg-ia">
Olá 😄 Eu sou a IA do STP-Digital.
</div>

</div>

<div class="input-area">

<input
type="text"
id="pergunta"
placeholder="Pergunte algo..."
>

<button onclick="enviar()">
Enviar
</button>

</div>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDBMcN2_Gm-n6CC48gbf6qrjMzGRDkJZtc",


authDomain: "stp-digital-c3ff2.firebaseapp.com",

projectId: "stp-digital-c3ff2",

storageBucket: "stp-digital-c3ff2.firebasestorage.app",

messagingSenderId: "1028151626773",

appId: "1:1028151626773:web:b5293deb0cb346825a921c"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.db = db;
window.collection = collection;
window.addDoc = addDoc;

</script>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="ia.js"></script>

</body>
</html>
