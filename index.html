<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
padding:30px;
}

/* topo */

.topo{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:40px;
}

.logo{
font-size:28px;
font-weight:bold;
background:linear-gradient(45deg,#3b82f6,#8b5cf6);
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
}

/* botão sair */

button{
padding:12px 20px;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#3b82f6,#8b5cf6);
color:white;
cursor:pointer;
font-size:15px;
width: 100%;
height: 100px;

}

/* cards */

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:linear-gradient(45deg,#3b82f6,#8b5cf6);
padding:25px;
border-radius:20px;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h2{
margin-bottom:15px;
}

.card p{
color:#cbd5e1;
}
.perfil{

width:55px;
height:55px;

border-radius:50%;

object-fit:cover;

cursor:pointer;

border:2px solid rgba(255,255,255,0.2);

transition:0.3s;


box-shadow:0 0 20px rgba(59,130,246,0.3);

}

.perfil:hover{

transform:scale(1.08);

box-shadow:0 0 25px #8b5cf6;

}


</style>
</head>

</div>
